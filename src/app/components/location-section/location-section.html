<section id="ubicacion" class="py-24 bg-light relative border-t border-gray-100">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="text-center mb-16">
      <span class="text-primary font-sans font-semibold tracking-widest uppercase text-sm mb-3 block">Ubicación</span>
      <h2 class="text-4xl md:text-5xl font-serif font-bold text-dark mb-4">Encuéntranos Aquí</h2>
      <div class="w-20 h-1 bg-primary mx-auto mb-6"></div>
      <p class="text-dark-gray max-w-2xl mx-auto text-lg font-light">Ubicados estratégicamente para ofrecerte el mejor acceso a la cultura y el encanto de la ciudad.</p>
    </div>

    <div class="relative bg-white rounded-3xl shadow-2xl overflow-hidden border-4 border-white h-[500px] group ring-1 ring-gray-200">
      <div class="absolute inset-0 bg-dark/5 group-hover:bg-transparent transition-colors duration-500 pointer-events-none z-10"></div>
      
      <iframe 
        [src]="mapUrl" 
        class="w-full h-full grayscale-[15%] group-hover:grayscale-0 transition-all duration-700" 
        style="border:0;" 
        allowfullscreen="" 
        loading="lazy" 
        referrerpolicy="no-referrer-when-downgrade">
      </iframe>
    </div>
  </div>
</section>
