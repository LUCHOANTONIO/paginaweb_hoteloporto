<div id="home"

    <!-- Lado Izquierdo: Hotel Oporto -->

        src="images/hotel_oporto.jpeg"
        alt="Hotel Oporto"
        class="w-full h-full object-cover object-center brightness-105 saturate-110" />

    </div>

    <!-- Lado Derecho: Oruro -->
    <div class="relative h-full w-full overflow-hidden">

        src="images/oruro_bg.png"

        class="w-full h-full object-cover object-center brightness-105 saturate-110" />

    </div>

    <!-- Subtítulo / Badge -->

      <span class="text-accent font-sans font-semibold tracking-[0.2em] uppercase text-[11px] sm:text-xs">

      <span class="text-accent text-3xl sm:text-5xl md:text-6xl lg:text-7xl block mt-1 md:mt-2 drop-shadow-[0_4px_20px_rgba(212,175,55,0.3)]">
        En el corazón de Oruro
      </span>
    </h1>

    <!-- Párrafo -->
    <p class="text-white/90 text-base sm:text-lg md:text-xl mb-8 md:mb-10 max-w-2xl mx-auto font-light leading-relaxed drop-shadow-[0_2px_8px_rgba(0,0,0,0.9)]">
      Descubre la combinación perfecta entre cultura viva, descanso privilegiado y confort en la ciudad del Pagador.
    </p>

    <!-- CTA Buttons -->
    <div class="flex flex-col sm:flex-row gap-4 justify-center items-center w-full max-w-md sm:max-w-none mx-auto">
      <a href="#habitaciones"
        class="w-full sm:w-auto px-8 py-4 bg-accent text-dark font-bold rounded-xl shadow-[0_10px_25px_rgba(212,175,55,0.35)] hover:shadow-[0_15px_30px_rgba(212,175,55,0.5)] hover:bg-accent/90 hover:-translate-y-0.5 active:translate-y-0 transition-all duration-300 text-sm uppercase tracking-wider flex items-center justify-center gap-2">

        Reservar Ahora

      <a href="#servicios"
