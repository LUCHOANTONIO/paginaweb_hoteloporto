<div id="home"

    </div>

    <!-- Lado Derecho: Oruro Paisaje -->

    <p class="text-white/95 text-base sm:text-lg md:text-xl mb-8 md:mb-10 max-w-2xl mx-auto font-light leading-relaxed drop-shadow-md px-2">

      <a href="#servicios"
