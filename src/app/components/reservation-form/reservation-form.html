<section id="reservas" class="w-full relative my-8 sm:my-12 md:my-16 px-4 sm:px-6">
  <div class="bg-white rounded-2xl md:rounded-3xl shadow-xl border border-gray-100 p-3 sm:p-4 md:p-3 mx-auto w-full max-w-5xl transition-all">
    
    <form [formGroup]="reservationForm" (ngSubmit)="onSubmit()" class="flex flex-col md:flex-row items-stretch md:items-center w-full gap-2.5 md:gap-0 relative">
      
      <!-- Field 1: Name -->
      <div class="flex-1 w-full px-4 py-2.5 sm:px-5 sm:py-3 bg-gray-50/70 md:bg-transparent hover:bg-gray-100/80 md:hover:bg-gray-50/80 rounded-xl md:rounded-3xl transition-all border border-gray-100 md:border-none focus-within:border-primary/40 focus-within:bg-white group cursor-text relative">
        <label class="flex items-center gap-1.5 text-[10px] md:text-[9px] font-bold text-gray-500 md:text-gray-400 uppercase tracking-widest mb-1 md:mb-0.5 group-focus-within:text-primary transition-colors">
          <svg class="w-3 h-3 text-primary/70 md:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
          Huésped
        </label>
        <input type="text" formControlName="name" class="w-full bg-transparent border-none p-0 text-dark font-sans md:font-serif text-base sm:text-lg focus:ring-0 placeholder:text-gray-400 md:placeholder:text-gray-300 placeholder:font-sans placeholder:text-sm focus:outline-none" placeholder="Nombre completo">
        <p *ngIf="reservationForm.get('name')?.invalid && reservationForm.get('name')?.touched" class="text-red-500 text-[11px] md:text-[10px] mt-1 md:mt-0 md:absolute md:bottom-0.5 md:left-6 font-medium">Requerido</p>
      </div>

      <!-- Divider (Desktop) -->
      <div class="hidden md:block w-px h-12 bg-gray-200 mx-1 shrink-0"></div>

      <!-- Field 2: DNI -->
      <div class="flex-1 w-full px-4 py-2.5 sm:px-5 sm:py-3 bg-gray-50/70 md:bg-transparent hover:bg-gray-100/80 md:hover:bg-gray-50/80 rounded-xl md:rounded-3xl transition-all border border-gray-100 md:border-none focus-within:border-primary/40 focus-within:bg-white group cursor-text relative">
        <label class="flex items-center gap-1.5 text-[10px] md:text-[9px] font-bold text-gray-500 md:text-gray-400 uppercase tracking-widest mb-1 md:mb-0.5 group-focus-within:text-primary transition-colors">
          <svg class="w-3 h-3 text-primary/70 md:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0a2 2 0 104 0m-5 8a2 2 0 100-4 2 2 0 000 4zm0 0c1.306 0 2.417.835 2.83 2M9 14a3.001 3.001 0 00-2.83 2M15 11h3m-3 4h2"></path></svg>
          Identificación
        </label>
        <input type="text" formControlName="dni" class="w-full bg-transparent border-none p-0 text-dark font-sans md:font-serif text-base sm:text-lg focus:ring-0 placeholder:text-gray-400 md:placeholder:text-gray-300 placeholder:font-sans placeholder:text-sm focus:outline-none" placeholder="DNI o Pasaporte">
        <p *ngIf="reservationForm.get('dni')?.invalid && reservationForm.get('dni')?.touched" class="text-red-500 text-[11px] md:text-[10px] mt-1 md:mt-0 md:absolute md:bottom-0.5 md:left-6 font-medium">Requerido (8 a 12 caracteres)</p>
      </div>

      <!-- Divider (Desktop) -->
      <div class="hidden md:block w-px h-12 bg-gray-200 mx-1 shrink-0"></div>

      <!-- Field 3: Dates (Grid en móvil, flex en desktop) -->
      <div class="flex-[1.5] w-full grid grid-cols-2 gap-2 sm:gap-3 md:flex md:items-center">
        <!-- Llegada -->
        <div class="flex-1 w-full px-3 sm:px-4 md:px-6 py-2.5 sm:py-3 bg-gray-50/70 md:bg-transparent hover:bg-gray-100/80 md:hover:bg-gray-50/80 rounded-xl md:rounded-3xl transition-all border border-gray-100 md:border-none focus-within:border-primary/40 focus-within:bg-white group relative cursor-pointer">
          <label class="flex items-center gap-1.5 text-[10px] md:text-[9px] font-bold text-gray-500 md:text-gray-400 uppercase tracking-widest mb-1 md:mb-0.5 group-focus-within:text-primary transition-colors">
            <svg class="w-3 h-3 text-primary/70 md:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
            Llegada
          </label>
          <input type="date" formControlName="startDate" class="w-full bg-transparent border-none p-0 text-dark font-sans md:font-serif text-xs sm:text-sm md:text-base lg:text-lg focus:ring-0 focus:outline-none cursor-pointer">
        </div>
        
        <!-- Flecha decorativa (solo desktop) -->
        <div class="hidden md:flex items-center justify-center text-gray-300 px-1 shrink-0">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
        </div>

        <!-- Salida -->
        <div class="flex-1 w-full px-3 sm:px-4 md:px-6 py-2.5 sm:py-3 bg-gray-50/70 md:bg-transparent hover:bg-gray-100/80 md:hover:bg-gray-50/80 rounded-xl md:rounded-3xl transition-all border border-gray-100 md:border-none focus-within:border-primary/40 focus-within:bg-white group relative cursor-pointer">
          <label class="flex items-center gap-1.5 text-[10px] md:text-[9px] font-bold text-gray-500 md:text-gray-400 uppercase tracking-widest mb-1 md:mb-0.5 group-focus-within:text-primary transition-colors">
            <svg class="w-3 h-3 text-primary/70 md:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
            Salida
          </label>
          <input type="date" formControlName="endDate" class="w-full bg-transparent border-none p-0 text-dark font-sans md:font-serif text-xs sm:text-sm md:text-base lg:text-lg focus:ring-0 focus:outline-none cursor-pointer">
        </div>
      </div>

      <!-- Botón de acción -->
      <div class="w-full md:w-auto p-1 md:p-2 mt-1 md:mt-0 shrink-0">
        <button type="submit" [disabled]="reservationForm.invalid && reservationForm.touched" class="w-full md:w-auto h-12 sm:h-14 min-h-[48px] md:min-h-[56px] px-6 sm:px-8 md:px-10 bg-gradient-to-r from-primary to-primary-dark hover:from-primary-dark hover:to-primary disabled:from-gray-200 disabled:to-gray-200 disabled:text-gray-400 text-white font-sans text-xs font-bold uppercase tracking-widest rounded-xl md:rounded-[1.5rem] transition-all duration-300 shadow-lg shadow-primary/20 hover:shadow-xl disabled:shadow-none flex items-center justify-center gap-3 cursor-pointer disabled:cursor-not-allowed group/btn">
          <span>Buscar Disponibilidad</span>
          <div class="w-6 h-6 rounded-full bg-white/20 flex items-center justify-center group-hover/btn:bg-white/30 transition-colors shrink-0">
            <svg class="w-3 h-3 group-hover/btn:translate-x-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path></svg>
          </div>
        </button>
      </div>

    </form>

  </div>
  
  <!-- Notificación flotante de confirmación -->
  <div *ngIf="isSubmitted" class="absolute -bottom-16 sm:-bottom-20 left-4 right-4 sm:left-0 sm:right-0 p-3 sm:p-4 mx-auto w-auto max-w-lg bg-white border border-gray-100 text-dark rounded-xl sm:rounded-full shadow-[0_10px_30px_rgba(0,0,0,0.12)] text-xs sm:text-sm text-center font-medium font-serif italic flex items-center justify-center gap-3 animate-fade-in-up z-40">
    <div class="relative flex h-3 w-3 shrink-0">
      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-primary opacity-75"></span>
      <span class="relative inline-flex rounded-full h-3 w-3 bg-primary"></span>
    </div>
    <span>Buscando las mejores suites disponibles para usted...</span>
  </div>
</section>
