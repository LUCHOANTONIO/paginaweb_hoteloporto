<section id="reservas" class="w-full relative mt-32 md:mt-40">
  <div class="bg-white rounded-lg shadow-md border border-gray-200 p-6 mx-auto w-full max-w-5xl">
    
    <form [formGroup]="reservationForm" (ngSubmit)="onSubmit()" class="flex flex-col md:flex-row items-center w-full relative">
      
      <!-- Field 1: Name -->
      <div class="flex-1 w-full px-6 py-3 hover:bg-gray-50/80 rounded-3xl transition-colors group cursor-text relative">
        <label class="block text-[9px] font-bold text-gray-400 uppercase tracking-widest mb-0.5 group-focus-within:text-primary transition-colors">Huésped</label>
        <input type="text" formControlName="name" class="w-full bg-transparent border-none p-0 text-dark font-serif text-lg focus:ring-0 placeholder:text-gray-300 placeholder:font-sans placeholder:text-sm focus:outline-none" placeholder="Nombre completo">
        <p *ngIf="reservationForm.get('name')?.invalid && reservationForm.get('name')?.touched" class="text-red-400 text-[10px] absolute bottom-1 left-6">Requerido</p>
      </div>

      <!-- Divider -->
      <div class="hidden md:block w-px h-12 bg-gray-200 mx-1"></div>

      <!-- Field 2: DNI -->
      <div class="flex-1 w-full px-6 py-3 hover:bg-gray-50/80 rounded-3xl transition-colors group cursor-text relative">
        <label class="block text-[9px] font-bold text-gray-400 uppercase tracking-widest mb-0.5 group-focus-within:text-primary transition-colors">Identificación</label>
        <input type="text" formControlName="dni" class="w-full bg-transparent border-none p-0 text-dark font-serif text-lg focus:ring-0 placeholder:text-gray-300 placeholder:font-sans placeholder:text-sm focus:outline-none" placeholder="DNI o Pasaporte">
        <p *ngIf="reservationForm.get('dni')?.invalid && reservationForm.get('dni')?.touched" class="text-red-400 text-[10px] absolute bottom-1 left-6">Requerido</p>
      </div>

      <!-- Divider -->
      <div class="hidden md:block w-px h-12 bg-gray-200 mx-1"></div>

      <!-- Field 3: Dates -->
      <div class="flex-[1.5] flex w-full items-center">
        <div class="flex-1 px-6 py-3 hover:bg-gray-50/80 rounded-3xl transition-colors group relative cursor-pointer">
          <label class="block text-[9px] font-bold text-gray-400 uppercase tracking-widest mb-0.5 group-focus-within:text-primary transition-colors">Llegada</label>
          <input type="date" formControlName="startDate" class="w-full bg-transparent border-none p-0 text-dark font-serif text-lg focus:ring-0 focus:outline-none cursor-pointer">
        </div>
        
        <div class="flex items-center justify-center text-gray-300 px-1 shrink-0">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
        </div>

        <div class="flex-1 px-6 py-3 hover:bg-gray-50/80 rounded-3xl transition-colors group relative cursor-pointer">
          <label class="block text-[9px] font-bold text-gray-400 uppercase tracking-widest mb-0.5 group-focus-within:text-primary transition-colors">Salida</label>
          <input type="date" formControlName="endDate" class="w-full bg-transparent border-none p-0 text-dark font-serif text-lg focus:ring-0 focus:outline-none cursor-pointer">
        </div>
      </div>

      <!-- Button -->
      <div class="w-full md:w-auto p-2">
        <button type="submit" [disabled]="reservationForm.invalid && reservationForm.touched" class="w-full md:w-auto h-full min-h-[56px] px-10 bg-primary hover:bg-primary-dark disabled:bg-gray-200 disabled:text-gray-400 text-white font-sans text-xs font-bold uppercase tracking-widest rounded-[1.5rem] transition-all duration-300 shadow-md hover:shadow-xl disabled:shadow-none flex items-center justify-center gap-3 cursor-pointer disabled:cursor-not-allowed group/btn">
          <span>Buscar</span>
          <div class="w-6 h-6 rounded-full bg-white/20 flex items-center justify-center group-hover/btn:bg-white/30 transition-colors">
            <svg class="w-3 h-3 group-hover/btn:translate-x-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path></svg>
          </div>
        </button>
      </div>

    </form>

  </div>
  
  <div *ngIf="isSubmitted" class="absolute -bottom-20 left-0 right-0 p-4 mx-auto w-max max-w-[90%] bg-white border border-gray-100 text-dark rounded-full shadow-[0_10px_30px_rgba(0,0,0,0.1)] text-sm text-center font-medium font-serif italic flex items-center gap-3 animate-fade-in-up z-40">
    <div class="relative flex h-3 w-3">
      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-primary opacity-75"></span>
      <span class="relative inline-flex rounded-full h-3 w-3 bg-primary"></span>
    </div>
    Buscando las mejores suites disponibles para usted...
  </div>
</section>
